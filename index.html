<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>暗区突袭 · 3D 射击闯关</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="game-root">
    <canvas id="c"></canvas>

    <!-- Crosshair -->
    <div id="crosshair" aria-hidden="true">
      <span class="ch ch-t"></span><span class="ch ch-b"></span>
      <span class="ch ch-l"></span><span class="ch ch-r"></span>
      <span class="ch-dot"></span>
    </div>

    <!-- Hit marker -->
    <div id="hitmark"></div>

    <!-- Damage vignette -->
    <div id="dmg-vignette"></div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hud-top">
        <div class="hud-chip" id="hud-level">关卡 1</div>
        <div class="hud-chip objective" id="hud-objective">清除所有目标</div>
        <div class="hud-chip" id="hud-timer"></div>
      </div>
      <div id="hud-bottom">
        <div class="stat-block">
          <div class="stat-label">生命</div>
          <div class="hp-bar"><div id="hp-fill"></div></div>
        </div>
        <div class="stat-block ammo-block">
          <div class="stat-label">弹药</div>
          <div id="ammo-text"><span id="ammo-cur">30</span><span class="ammo-sep">/</span><span id="ammo-res">90</span></div>
        </div>
        <div class="stat-block kills-block">
          <div class="stat-label">击杀</div>
          <div id="kills-text">0</div>
        </div>
      </div>
      <div id="wave-banner" class="hidden"></div>
    </div>

    <!-- Mobile controls -->
    <div id="mobile-ui" class="hidden">
      <div id="joy-zone">
        <div id="joy-base"><div id="joy-knob"></div></div>
      </div>
      <div id="look-zone"></div>
      <button id="btn-fire" type="button" aria-label="射击">开火</button>
      <button id="btn-reload" type="button" aria-label="换弹">换弹</button>
      <button id="btn-pause-m" type="button" aria-label="暂停">‖</button>
    </div>

    <!-- Start overlay -->
    <div id="overlay-start" class="overlay">
      <div class="panel glass">
        <div class="badge">v2 · 暗区突袭</div>
        <h1>3D 射击闯关</h1>
        <p class="sub">十关递进 · 手感重做 · 手机可玩</p>
        <div id="level-select" class="level-grid"></div>
        <div class="settings-row">
          <label>鼠标灵敏度 <input type="range" id="sens" min="0.4" max="2.5" step="0.1" value="1.0" /></label>
          <label class="chk"><input type="checkbox" id="mute" /> 静音</label>
          <label class="chk"><input type="checkbox" id="lowfx" /> 低特效（手机）</label>
        </div>
        <button id="btn-start" class="btn primary">开始游戏</button>
        <p class="hint desk">电脑：WASD 移动 · 鼠标瞄准 · 左键射击 · R 换弹 · Esc 暂停</p>
        <p class="hint mob">手机：左摇杆移动 · 右半屏拖视角 · 开火／换弹按钮</p>
      </div>
    </div>

    <!-- Pause -->
    <div id="overlay-pause" class="overlay hidden">
      <div class="panel glass">
        <h2>已暂停</h2>
        <button id="btn-resume" class="btn primary">继续</button>
        <button id="btn-restart" class="btn">重开本关</button>
        <button id="btn-menu" class="btn ghost">返回选关</button>
        <div class="settings-row compact">
          <label>灵敏度 <input type="range" id="sens2" min="0.4" max="2.5" step="0.1" value="1.0" /></label>
          <label class="chk"><input type="checkbox" id="mute2" /> 静音</label>
        </div>
      </div>
    </div>

    <!-- Level clear -->
    <div id="overlay-clear" class="overlay hidden">
      <div class="panel glass">
        <h2 id="clear-title">关卡通过</h2>
        <p id="clear-stats" class="sub"></p>
        <button id="btn-next" class="btn primary">下一关</button>
        <button id="btn-clear-menu" class="btn ghost">返回选关</button>
      </div>
    </div>

    <!-- Game over -->
    <div id="overlay-dead" class="overlay hidden">
      <div class="panel glass">
        <h2>行动失败</h2>
        <p class="sub">再试一次？</p>
        <button id="btn-retry" class="btn primary">重开本关</button>
        <button id="btn-dead-menu" class="btn ghost">返回选关</button>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden"></div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
