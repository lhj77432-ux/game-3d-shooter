name: Enable GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Pages (legacy, main /)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          API="https://api.github.com/repos/${{ github.repository }}/pages"
          HDR=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          BODY='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pages-out.json -w "%{http_code}" -X POST "${HDR[@]}" "$API" -d "$BODY" || true)
          echo "POST /pages => $code"
          cat /tmp/pages-out.json || true
          echo
          if [ "$code" = "409" ] || [ "$code" = "422" ]; then
            code2=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" -X PUT "${HDR[@]}" "$API" -d "$BODY" || true)
            echo "PUT /pages => $code2"
            cat /tmp/pages-put.json || true
            echo
          fi
          curl -sS "${HDR[@]}" "$API" || true
          echo
